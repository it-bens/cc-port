name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly govulncheck canary; skipped per-PR to keep review noise low.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Vet
        run: go vet ./...

      - name: Vet (darwin)
        run: GOOS=darwin go vet ./...

      - name: Unit tests
        run: go test -race -coverprofile=coverage.txt ./...

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.txt
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Large archive tests
        run: go test -tags large ./internal/importer/...

      - name: Pure-Go build
        run: CGO_ENABLED=0 go build ./...

      - name: Integration tests
        run: go test -tags integration -race -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      # banner_logo.go builds only under the logo tag, which excludes banner_default.go,
      # so the default pass cannot lint it.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --build-tags=integration,large,logo ./...
          skip-save-cache: true
      - name: Dead code
        run: make deadcode

  govulncheck:
    # Scan deps against vuln.go.dev on the weekly cron only. Per-PR runs
    # would surface unreachable-vuln false positives and add review noise;
    # the cron is the canary for newly disclosed advisories hitting pinned
    # deps between pushes. workflow_dispatch re-checks a bump on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Scan against the newest 1.26 patch so the canary fails only on
          # genuinely unpatched vulns, not on a toolchain that is a patch behind.
          go-version: "1.27"
          check-latest: true
      - name: Install govulncheck
        # renovate: datasource=go depName=golang.org/x/vuln
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Run govulncheck
        run: govulncheck ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.3
          args: check

  release-snapshot:
    # Full goreleaser pipeline — build, archive, checksum, cosign sign-blob —
    # without publishing. Catches release-time regressions (e.g. cosign flag
    # changes) before tagging. Skips homebrew so no tap interaction.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: "v3.1.3"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.3
          args: release --snapshot --clean --skip=publish,homebrew
