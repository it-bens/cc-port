# Coverage is reported on pull requests but never fails them.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Test-fixture packages run only from other packages' tests, which per-package
# coverage never credits to them.
ignore:
  - "internal/tool/claude/claudetest"
  - "internal/tool/codex/codextest"
